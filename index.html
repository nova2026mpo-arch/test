<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1e9de">
<title>کافه نوا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>
:root{--cream:#f1e9de;--burg:#8f3a5c;box-sizing:border-box;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--cream);font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;container-type:inline-size}
.page{position:relative;width:100%;aspect-ratio:941 / 1672;background:var(--cream);overflow:hidden}
.page img{display:block;-webkit-user-drag:none;user-select:none}
.page>img,.dec,.ic,.sp,.ph{position:absolute}
.logo{position:absolute;left:42.933%;top:1.376%;width:14.134%;aspect-ratio:1;border-radius:50%}
.cafe{position:absolute;left:6.376%;top:10.467%;width:87.885%;height:22.010%;object-fit:cover;border-radius:2.4cqw}
.dec{pointer-events:none}
.box{position:absolute;margin:0;padding:0;border:0;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer;
  border-radius:2.3cqw;overflow:hidden;touch-action:manipulation;
  transition:transform .22s cubic-bezier(.3,1.4,.5,1),filter .2s}
.b-m,.b-b{border-radius:2.1cqw}
.b-mint{border-radius:2.3cqw}
.box:active{transform:scale(.955);filter:brightness(.97)}
.box.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.93)}100%{transform:scale(1)}}
.box:focus-visible{outline:.5cqw solid var(--burg);outline-offset:.5cqw}
.lb{position:absolute;left:0;right:0;transform:translateY(-50%);text-align:center;font-size:var(--fs);font-weight:600;line-height:1.2;white-space:nowrap;pointer-events:none}
.b-s .lb{font-weight:500}
.ph{border-radius:2.6cqw;object-fit:cover;aspect-ratio:189/211;height:auto}
@media(hover:hover){.box:hover{filter:brightness(1.03)}}

/* full-screen colour wipe: only transform/opacity are animated (compositor, no repaint) */
.wipe{position:fixed;z-index:50;border-radius:50%;background:var(--bg);transform:scale(0);will-change:transform;
  visibility:hidden;backface-visibility:hidden;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:51;visibility:hidden;opacity:0;color:var(--fg);will-change:opacity;overflow-y:auto;overscroll-behavior:contain}
.sheet.on{visibility:visible}
.sheet-in{position:relative;min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
.back{align-self:flex-start;display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit;font:inherit;font-size:15px;font-weight:600;padding:10px 4px;cursor:pointer}
.back svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back:active{opacity:.6}
.big{width:120px;height:84px;object-fit:contain;margin-top:3vh;flex:none}
.sheet h2{margin:14px 0 8px;font-size:26px;font-weight:700;text-align:center}
.sheet p{margin:0;font-size:15px;line-height:1.9;text-align:center;opacity:.85;max-width:300px}
.grid[hidden]{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:22px}
.grid img{width:100%;aspect-ratio:188/244;object-fit:cover;border-radius:16px}
.sheet.photos .big{display:none}
.sheet.photos h2{margin-top:6px}
@media(prefers-reduced-motion:reduce){.box,.box.pop{animation:none;transition:none}}
</style>
</head>

<script>
(function(){
  var wipe=document.getElementById('wipe'),sheet=document.getElementById('sheet'),html=document.documentElement,
      cur=null,busy=false,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,
      D=reduce?1:480,EASE='cubic-bezier(.55,.05,.2,1)',O=null,R=0;
  function place(box){
    var r=box.getBoundingClientRect(),W=innerWidth,H=innerHeight;
    O={x:r.left+r.width/2,y:r.top+r.height/2};
    R=Math.ceil(Math.hypot(Math.max(O.x,W-O.x),Math.max(O.y,H-O.y)))+2;
    var s=wipe.style;s.width=s.height=(R*2)+'px';s.left=(O.x-R)+'px';s.top=(O.y-R)+'px';
  }
  function fill(box){
    var cs=getComputedStyle(box),photos=box.dataset.id==='shared';
    document.documentElement.style.setProperty('--bg',cs.getPropertyValue('--bg'));
    wipe.style.setProperty('--bg',cs.getPropertyValue('--bg'));
    sheet.style.setProperty('--fg',cs.getPropertyValue('--fg'));
    document.getElementById('sTitle').textContent=box.dataset.label;
    var ic=box.querySelector('.ic');document.getElementById('sIcon').src=ic?ic.src:'';
    sheet.classList.toggle('photos',photos);
    document.getElementById('sGrid').hidden=!photos;
    document.getElementById('sText').hidden=photos;
  }
  function pop(b){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
  function open(box,push){
    if(busy||cur)return;busy=true;cur=box;
    fill(box);place(box);pop(box);
    wipe.style.visibility='visible';html.classList.add('lock');
    sheet.scrollTop=0;
    if(push)location.hash=box.dataset.id;
    sheet.classList.add('on');sheet.setAttribute('aria-hidden','false');
    sheet.animate([{opacity:0},{opacity:1}],{duration:reduce?1:170,delay:reduce?0:D*.42,easing:'ease-out',fill:'forwards'});
    var a=wipe.animate([{transform:'scale(0)'},{transform:'scale(1)'}],{duration:D,easing:EASE,fill:'forwards'});
    a.onfinish=function(){busy=false;document.getElementById('back').focus({preventScroll:true})};
  }
  function close(){
    if(busy||!cur)return;busy=true;var box=cur;
    place(box);
    sheet.getAnimations().forEach(function(x){x.cancel()});
    var f=sheet.animate([{opacity:1},{opacity:0}],{duration:reduce?1:110,easing:'ease-in',fill:'forwards'});
    var a=wipe.animate([{transform:'scale(1)'},{transform:'scale(0)'}],{duration:D,easing:EASE,fill:'forwards'});
    a.onfinish=function(){
      sheet.getAnimations().forEach(function(x){x.cancel()});
      wipe.getAnimations().forEach(function(x){x.cancel()});
      sheet.classList.remove('on');sheet.setAttribute('aria-hidden','true');
      wipe.style.visibility='hidden';html.classList.remove('lock');
      pop(box);box.focus({preventScroll:true});cur=null;busy=false;
    };
  }
  document.querySelectorAll('.box').forEach(function(b){b.addEventListener('click',function(){open(b,true)})});
  function back(){if(location.hash)history.back();else close()}
  document.getElementById('back').addEventListener('click',back);
  addEventListener('hashchange',function(){if(!location.hash)close()});
  addEventListener('keydown',function(e){if(e.key==='Escape')back()});
})();
</script>
